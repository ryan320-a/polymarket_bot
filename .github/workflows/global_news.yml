name: Global News Translator

on:
  schedule:
    - cron: '0 * * * *' # 每小時整點執行一次
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 同時快取「網址去重紀錄」與「24小時語義話題記憶庫」
      - name: Cache news history and topic memory
        uses: actions/cache@v4
        with:
          path: |
            sent_global_news.txt
            covered_topics.json
          key: global-news-memory-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            global-news-memory-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests feedparser openai beautifulsoup4

      - name: Run Global News Bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python global_news_bot.py
