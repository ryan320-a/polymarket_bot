name: Global News Translator

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘執行一次
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 建立專屬的新聞歷史紀錄暫存，避免重複發送
      - name: Cache sent global news history
        uses: actions/cache@v4
        with:
          path: sent_global_news.txt
          key: global-news-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            global-news-history-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests feedparser openai beautifulsoup4

      - name: Run Global News Bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python global_news_bot.py
